name: 'SAMOSA'
description: 'Lint the math of a paper: every align block is checked step by step, exactly, and a wrong step fails the build.'
author: 'Hussain'
branding:
  icon: 'check-circle'
  color: 'gold'
inputs:
  path:
    description: 'The files to check, as a glob.'
    required: false
    default: '**/*.tex'
  fail-on:
    description: 'The verdicts that make the action fail.'
    required: false
    default: 'wrong,shape'
  format:
    description: 'pretty, json, sarif or github.'
    required: false
    default: 'github'
  seed:
    description: 'The seed of the sampling, so the run is reproducible.'
    required: false
    default: '0'
runs:
  using: 'composite'
  steps:
    - name: 'Check the derivation'
      run: node $GITHUB_ACTION_PATH/pkg/dist/cli.mjs check ${{ inputs.path }} --format ${{ inputs.format }} --fail-on ${{ inputs.fail-on }} --seed ${{ inputs.seed }}
      shell: bash
    - name: 'Upload the results'
      if: ${{ inputs.format == 'sarif' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: samosa.sarif
