name: 'SAMOSA'
description: 'Lint the math of a paper: every align block is checked step by step, exactly, and a wrong step fails the build.'
author: 'Hussain'
branding:
  icon: 'check-circle'
  color: 'gold'
inputs:
  path:
    description: 'The files to check, as a glob. The glob is expanded by the command, so ** works.'
    required: false
    default: '**/*.tex'
  fail-on:
    description: 'The verdicts that make the action fail.'
    required: false
    default: 'wrong,shape'
  format:
    description: 'pretty, json, sarif or github.'
    required: false
    default: 'github'
  seed:
    description: 'The seed of the sampling, so the run is reproducible. Empty, and the engine uses its own default.'
    required: false
    default: ''
  preset:
    description: 'The id of a Cookbook preset to check instead of a file.'
    required: false
    default: ''
  require-math:
    description: 'A file with no display math fails the run, because nothing was checked in it.'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: 'Check the derivation'
      # The inputs arrive as environment variables, never interpolated into
      # the script: an input is data, and data must not become code.
      # The pattern is quoted, so the command expands it and the shell does
      # not eat the stars. The SARIF goes in a file, because that is what the
      # upload step reads; the other formats are printed, because that is
      # what the annotations are made of.
      env:
        SAMOSA_PATH: ${{ inputs.path }}
        SAMOSA_FAIL_ON: ${{ inputs.fail-on }}
        SAMOSA_FORMAT: ${{ inputs.format }}
        SAMOSA_SEED: ${{ inputs.seed }}
        SAMOSA_PRESET: ${{ inputs.preset }}
        SAMOSA_REQUIRE_MATH: ${{ inputs.require-math }}
      run: |
        set -euo pipefail
        args=(check "$SAMOSA_PATH" --format "$SAMOSA_FORMAT" --fail-on "$SAMOSA_FAIL_ON")
        # the seed is passed only when it is set, so the Action checks with
        # the same seed as everything else (review 5.3)
        if [ -n "$SAMOSA_SEED" ]; then
          args+=(--seed "$SAMOSA_SEED")
        fi
        if [ -n "$SAMOSA_PRESET" ]; then
          args+=(--preset "$SAMOSA_PRESET")
        fi
        if [ "$SAMOSA_REQUIRE_MATH" = "true" ]; then
          args+=(--require-math)
        fi
        if [ "$SAMOSA_FORMAT" = "sarif" ]; then
          node "$GITHUB_ACTION_PATH/pkg/dist/cli.mjs" "${args[@]}" --output samosa.sarif
        else
          node "$GITHUB_ACTION_PATH/pkg/dist/cli.mjs" "${args[@]}"
        fi
      shell: bash
    - name: 'Upload the results'
      # the upload runs even when the check fails, or the report of the
      # failure would be lost
      if: always() && inputs.format == 'sarif'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: samosa.sarif
