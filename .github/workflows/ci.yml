name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: The tests, the lint and the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          # the toolchain wants a recent Node, and the engine says so
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm build:pkg
      - name: The CLI still runs
        run: node pkg/dist/cli.mjs check --help
      - name: The engine is not slower than the baseline
        # The baseline is a ratio against a calibration loop, so it is close
        # to machine independent, but a shared runner is still slower at
        # allocating than a laptop. The gate here catches a real regression,
        # and the tight one (a fifth) runs on a developer's machine.
        run: BENCH_TOLERANCE=3 pnpm bench
      - name: The cookbook has no false checkmark
        run: pnpm check:corpus
      - name: The demo of the landing page is what the engine says
        run: pnpm gen:demo && git diff --exit-code src/landing/generated.json
      - name: The math of the landing page is rendered
        run: pnpm gen:tex && git diff --exit-code src/landing/generated-tex.json
      - name: The committed CLI is the one that was built
        # the Action runs the CLI from the repository, so it may not go stale
        run: git diff --exit-code pkg/dist

  e2e:
    name: The browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
