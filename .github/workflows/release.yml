name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Build, publish and announce
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: The changelog has a section for the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          section="$(awk -v version="$version" '
            /^## \[/{ in_section = ($0 ~ ("\\[" version "]")); next }
            in_section { print }
          ' CHANGELOG.md)"
          if [ -z "$(echo "$section" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for [$version]; add it before tagging"
            exit 1
          fi

      - run: pnpm build:pkg

      - name: The committed generated files are what the engine says
        run: |
          pnpm gen:readme && git diff --exit-code README.md docs/COOKBOOK.md
          pnpm gen:demo && git diff --exit-code src/landing/generated.json
          pnpm gen:tex && git diff --exit-code src/landing/generated-tex.json

      # npm needs one of two things, both of them the owner's: trusted
      # publishing for this package on npmjs.com (no token at all), or an
      # NPM_TOKEN secret on the repository. With neither, the publish fails
      # loudly here, which is correct.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --provenance
        working-directory: pkg

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # the section of the tag in the changelog, or the Unreleased
          # section when the tag was cut before the file was renamed
          section="$(awk -v version="$version" '
            /^## \[/{ in_section = ($0 ~ ("\\[" version "]")); next }
            in_section { print }
          ' CHANGELOG.md)"
          if [ -z "$section" ]; then
            section="$(awk '
              /^## \[Unreleased\]/{ in_section = 1; next }
              /^## \[/{ exit }
              in_section { print }
            ' CHANGELOG.md)"
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$section"
